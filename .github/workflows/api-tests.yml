name: Проверка API-тестов

on:
  push:
    branches:
      - api-tests
  workflow_dispatch:

jobs:
  create-courier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Создание курьера
        run: pytest tests/test_create_courier.py -v

  login-courier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Авторизация курьера
        run: pytest tests/test_login_courier.py -v

  create-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Создание заказа
        run: pytest tests/test_create_order.py -v

  orders-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Список заказов
        run: pytest tests/test_orders_list.py -v
