name: Диагностика API-тестов

on:
  push:
    branches:
      - api-tests
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Запустить тесты и сохранить полный результат
        shell: bash
        run: |
          set +e
          pytest tests -vv -rA --tb=long --showlocals --durations=0 --alluredir=allure_results > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          echo "$code" > pytest-exit-code.txt
          exit 0
      - name: Сохранить диагностику
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            pytest-output.txt
            pytest-exit-code.txt
            allure_results
