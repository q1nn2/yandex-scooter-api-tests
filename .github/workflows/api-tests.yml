name: API-тесты

on:
  push:
    branches:
      - api-tests
    paths-ignore:
      - 'allure_results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: pip install -r requirements.txt
      - name: Запустить тесты
        id: pytest
        shell: bash
        run: |
          rm -rf allure_results
          set +e
          pytest tests -v --tb=short --alluredir=allure_results
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Сохранить результаты Allure в репозитории
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allure_results
          git diff --cached --quiet || git commit -m "Обновлены результаты Allure"
          git push
      - name: Проверить результат тестов
        run: exit ${{ steps.pytest.outputs.exit_code }}
